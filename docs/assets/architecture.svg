<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%">
  <defs>
    <style>
      .bg { fill: #0F172A; }
      .box { fill: #1E293B; stroke: #334155; stroke-width: 2; rx: 12; transition: all 0.3s ease; }
      .box:hover { stroke: #60A5FA; filter: drop-shadow(0 0 8px rgba(96,165,250,0.5)); }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; font-size: 16px; fill: #F8FAFC; }
      .text-desc { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; fill: #94A3B8; }
      .line { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 20s linear infinite; }
      .arrow { fill: #475569; }
      .icon-bg { fill: rgba(255,255,255,0.05); rx: 8; }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <rect width="1000" height="250" class="bg" rx="16"/>

  <!-- Connecting Lines -->
  <path class="line" d="M 230 125 L 310 125" />
  <polygon class="arrow" points="310,120 310,130 320,125" />
  
  <path class="line" d="M 490 125 L 570 125" />
  <polygon class="arrow" points="570,120 570,130 580,125" />

  <path class="line" d="M 750 125 L 830 125" />
  <polygon class="arrow" points="830,120 830,130 840,125" />

  <!-- 1. Scraper -->
  <g transform="translate(50, 75)">
    <rect class="box" width="180" height="100" />
    <rect width="180" height="4" fill="#3B82F6" rx="2" />
    <rect x="15" y="15" width="30" height="30" class="icon-bg" />
    <path d="M 22 25 L 30 33 L 38 25" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22 30 L 30 38 L 38 30" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <text x="55" y="35" class="text-title">Scraper Engine</text>
    <text x="20" y="65" class="text-desc">Node.js + Playwright</text>
    <text x="20" y="85" class="text-desc">Bypasses Modals</text>
  </g>

  <!-- 2. Data -->
  <g transform="translate(310, 75)">
    <rect class="box" width="180" height="100" />
    <rect width="180" height="4" fill="#10B981" rx="2" />
    <rect x="15" y="15" width="30" height="30" class="icon-bg" />
    <path d="M 20 22 h 20 v 16 h -20 z" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 28 h 20" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <text x="55" y="35" class="text-title">Raw JSON</text>
    <text x="20" y="65" class="text-desc">Chapter Data</text>
    <text x="20" y="85" class="text-desc">Diagram Assets</text>
  </g>

  <!-- 3. Audit -->
  <g transform="translate(570, 75)">
    <rect class="box" width="180" height="100" />
    <rect width="180" height="4" fill="#F59E0B" rx="2" />
    <rect x="15" y="15" width="30" height="30" class="icon-bg" />
    <circle cx="30" cy="30" r="8" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <path d="M 36 36 L 42 42" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <text x="55" y="35" class="text-title">Audit System</text>
    <text x="20" y="65" class="text-desc">Fidelity Check</text>
    <text x="20" y="85" class="text-desc">Distractor Match</text>
  </g>

  <!-- 4. Dashboard -->
  <g transform="translate(830, 75)">
    <rect class="box" width="120" height="100" />
    <rect width="120" height="4" fill="#8B5CF6" rx="2" />
    <rect x="15" y="15" width="30" height="30" class="icon-bg" />
    <rect x="20" y="20" width="20" height="20" fill="none" stroke="#A78BFA" stroke-width="2" rx="2"/>
    <path d="M 20 27 h 20" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <text x="55" y="35" class="text-title">Vite UI</text>
    <text x="20" y="65" class="text-desc">Static Build</text>
    <text x="20" y="85" class="text-desc">Review Tools</text>
  </g>
</svg>
