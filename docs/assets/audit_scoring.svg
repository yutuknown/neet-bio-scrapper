<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%">
  <defs>
    <!-- Rich deep background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D21" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.6"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEngine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Line Gradients -->
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="300" fill="url(#bg)" rx="16" stroke="#1E293B" stroke-width="2"/>

  <!-- Background Data Flow Overlay -->
  <path d="M 0 150 Q 250 50 500 150 T 1000 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>
  <path d="M 0 150 Q 250 250 500 150 T 1000 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>

  <!-- Path: Structural -> Semantic -->
  <path d="M 220 100 L 250 150" fill="none" stroke="url(#line1)" stroke-width="4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite" />
  </path>
  <circle cx="220" cy="100" r="4" fill="#3B82F6" filter="url(#glowBlue)"/>

  <!-- Path: Completeness -> Semantic -->
  <path d="M 220 200 L 250 150" fill="none" stroke="url(#line2)" stroke-width="4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite" />
  </path>
  <circle cx="220" cy="200" r="4" fill="#10B981" filter="url(#glowGreen)"/>
  
  <!-- Path: Semantic -> Engine -->
  <path d="M 430 150 L 470 150" fill="none" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="5" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1s" repeatCount="indefinite" />
  </path>
  <polygon points="464,145 474,150 464,155" fill="#F59E0B" filter="url(#glowEngine)"/>
  <circle cx="430" cy="150" r="4" fill="#8B5CF6" filter="url(#glowPurple)"/>

  <!-- Path: Engine -> Risk Bands -->
  <path d="M 690 150 L 800 150" fill="none" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="5" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1s" repeatCount="indefinite" />
  </path>
  <polygon points="790,143 804,150 790,157" fill="#F59E0B" />
  <circle cx="690" cy="150" r="4" fill="#F59E0B" filter="url(#glowEngine)"/>

  <!-- Box 1: Structural -->
  <!-- Inner lines instead of overflowing rects for the accent color -->
  <g transform="translate(40, 60)" filter="url(#shadow)">
    <rect width="180" height="80" fill="#0F172A" stroke="#1E293B" stroke-width="2" rx="16" />
    <path d="M 12 16 v 48" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" filter="url(#glowBlue)"/>
    <text x="95" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#F8FAFC" text-anchor="middle">Structural Acc.</text>
    <text x="95" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Schema Validity</text>
    <text x="95" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#3B82F6" text-anchor="middle">Weight: 0.25</text>
  </g>

  <!-- Box 2: Completeness -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="180" height="80" fill="#0F172A" stroke="#1E293B" stroke-width="2" rx="16" />
    <path d="M 12 16 v 48" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" filter="url(#glowGreen)"/>
    <text x="95" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#F8FAFC" text-anchor="middle">Completeness</text>
    <text x="95" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Asset Coverage</text>
    <text x="95" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#10B981" text-anchor="middle">Weight: 0.35</text>
  </g>
  
  <!-- Box 3: Semantic -->
  <g transform="translate(250, 110)" filter="url(#shadow)">
    <rect width="180" height="80" fill="#0F172A" stroke="#1E293B" stroke-width="2" rx="16" />
    <path d="M 12 16 v 48" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" filter="url(#glowPurple)"/>
    <text x="95" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#F8FAFC" text-anchor="middle">Semantic Acc.</text>
    <text x="95" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Block Alignment</text>
    <text x="95" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#8B5CF6" text-anchor="middle">Weight: 0.40</text>
  </g>

  <!-- Scoring Engine -->
  <g transform="translate(470, 90)" filter="url(#glowEngine)">
    <!-- Main Box -->
    <rect width="220" height="120" fill="#0F172A" stroke="#F59E0B" stroke-width="2" rx="20" />
    <rect x="2" y="2" width="216" height="116" fill="#F59E0B" fill-opacity="0.05" rx="18" />
    
    <!-- Sophisticated Gear/Radar animation -->
    <!-- Fixed transform-origin issue by explicitly adding the attribute -->
    <circle cx="110" cy="40" r="22" fill="#F59E0B" fill-opacity="0.1" stroke="#FBBF24" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0 110 40" to="-360 110 40" dur="10s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="110" cy="40" r="14" fill="none" stroke="#FBBF24" stroke-width="3">
      <animate attributeName="r" values="14;16;14" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <path d="M 110 20 V 60 M 90 40 H 130" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" transform-origin="110px 40px">
      <animateTransform attributeName="transform" type="rotate" from="0 110 40" to="360 110 40" dur="6s" repeatCount="indefinite" />
    </path>
    <circle cx="110" cy="40" r="3" fill="#F8FAFC" />
    
    <!-- Text -->
    <text x="110" y="86" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Scoring Engine</text>
    <text x="110" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#F59E0B" text-anchor="middle">score_chapter.py</text>
  </g>

  <!-- Risk Bands -->
  <g transform="translate(800, 70)" filter="url(#shadow)">
    <rect width="160" height="160" fill="#0F172A" stroke="#1E293B" stroke-width="2" rx="16" />
    <text x="80" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Risk Bands</text>
    
    <!-- Premium Pill Designs -->
    <g transform="translate(15, 45)">
      <rect width="130" height="28" rx="14" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="20" cy="14" r="5" fill="#EF4444">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="75" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#EF4444" text-anchor="middle">High Risk</text>
    </g>

    <g transform="translate(15, 83)">
      <rect width="130" height="28" rx="14" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="20" cy="14" r="5" fill="#F59E0B" />
      <text x="75" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F59E0B" text-anchor="middle">Medium Risk</text>
    </g>

    <g transform="translate(15, 121)">
      <rect width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="20" cy="14" r="5" fill="#10B981" />
      <text x="75" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#10B981" text-anchor="middle">Low Risk</text>
    </g>
  </g>

</svg>
