<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Abstract Shapes / Data Elements -->
  <!-- Network Nodes -->
  <g stroke="rgba(139, 92, 246, 0.4)" stroke-width="2">
    <line x1="750" y1="120" x2="900" y2="170" />
    <line x1="900" y1="170" x2="1000" y2="90" />
    <line x1="900" y1="170" x2="950" y2="300" />
    <line x1="750" y1="120" x2="800" y2="270" />
    <line x1="800" y1="270" x2="950" y2="300" />
  </g>

  <!-- Node Circles -->
  <g fill="url(#accent-grad)" filter="url(#glow)">
    <circle cx="750" cy="120" r="8" />
    <circle cx="900" cy="170" r="14" />
    <circle cx="1000" cy="90" r="6" />
    <circle cx="800" cy="270" r="10" />
    <circle cx="950" cy="300" r="8" />
  </g>

  <!-- Decorative DNA-like Sine waves -->
  <path d="M 650 350 Q 700 300 750 350 T 850 350 T 950 350 T 1050 350" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 650 350 Q 700 400 750 350 T 850 350 T 950 350 T 1050 350" fill="none" stroke="url(#accent-grad)" stroke-width="4" opacity="0.2"/>

  <!-- Glowing Accent Line -->
  <rect x="100" y="320" width="120" height="6" fill="url(#accent-grad)" rx="3" filter="url(#glow)" />

  <!-- Typography -->
  <text x="100" y="160" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="64" fill="#F9FAFB" letter-spacing="-1">
    NEET Bio Scraper
  </text>
  <text x="100" y="220" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" font-size="28" fill="#D1D5DB" letter-spacing="0.5">
    High-Fidelity Question Extraction Pipeline
  </text>
  <text x="100" y="260" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" font-size="18" fill="#9CA3AF">
    Node.js • Playwright • Vite Dashboard • Audits
  </text>

  <!-- Floating UI Cards (Glassmorphism) -->
  <g transform="translate(850, -40)">
    <rect x="0" y="80" width="260" height="80" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="16" />
    <circle cx="40" cy="120" r="18" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2"/>
    <path d="M 32 120 L 37 125 L 48 113" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="115" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600" font-size="16" fill="#F3F4F6">Pedagogical Fidelity</text>
    <text x="75" y="135" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" font-size="14" fill="#9CA3AF">100% Asset Preservation</text>
  </g>
</svg>
