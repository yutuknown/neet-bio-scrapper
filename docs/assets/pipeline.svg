<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%">
  <!-- Background -->
  <rect width="1000" height="200" fill="#0B1121" rx="16" stroke="#1E293B" stroke-width="2" />

  <!-- Path Base -->
  <path d="M 120 110 L 880 110" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="6" />
  <!-- Dashed Overlay with SMIL Animation -->
  <path d="M 120 110 L 880 110" fill="none" stroke="#3B82F6" stroke-width="6" stroke-dasharray="16 12">
    <animate attributeName="stroke-dashoffset" from="112" to="0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Nodes -->
  <!-- Node 1 -->
  <g transform="translate(60, 70)">
    <rect width="160" height="90" fill="#1E293B" stroke="#3B82F6" stroke-width="3" rx="12" />
    <circle cx="80" cy="0" r="24" fill="#0B1121" stroke="#3B82F6" stroke-width="4">
      <animate attributeName="r" values="24;26;24" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#3B82F6" text-anchor="middle">1</text>
    
    <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC" text-anchor="middle">Fetch Links</text>
    <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Subject URLs</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(280, 70)">
    <rect width="160" height="90" fill="#1E293B" stroke="#10B981" stroke-width="3" rx="12" />
    <circle cx="80" cy="0" r="24" fill="#0B1121" stroke="#10B981" stroke-width="4">
      <animate attributeName="r" values="24;26;24" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#10B981" text-anchor="middle">2</text>
    
    <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC" text-anchor="middle">Parse Data</text>
    <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Extract Q &amp; A</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(500, 70)">
    <rect width="160" height="90" fill="#1E293B" stroke="#F59E0B" stroke-width="3" rx="12" />
    <circle cx="80" cy="0" r="24" fill="#0B1121" stroke="#F59E0B" stroke-width="4">
      <animate attributeName="r" values="24;26;24" dur="2s" begin="1s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#F59E0B" text-anchor="middle">3</text>
    
    <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC" text-anchor="middle">Python Audit</text>
    <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Score &amp; Gaps</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(720, 70)">
    <rect width="160" height="90" fill="#1E293B" stroke="#8B5CF6" stroke-width="3" rx="12" />
    <circle cx="80" cy="0" r="24" fill="#0B1121" stroke="#8B5CF6" stroke-width="4">
      <animate attributeName="r" values="24;26;24" dur="2s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#8B5CF6" text-anchor="middle">4</text>
    
    <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC" text-anchor="middle">Dashboard</text>
    <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">Local Review</text>
  </g>

</svg>
